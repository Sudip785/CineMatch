
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: cinematch-backend:latest
    container_name: backend
    env_file:
      - .env

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: cinematch-frontend:latest
    container_name: frontend
    ports:
      - "80:80"
